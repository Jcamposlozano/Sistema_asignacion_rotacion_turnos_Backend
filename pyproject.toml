[project]
name = "asignacion-estudiantes-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Jonathan Campos Lozano",email = "jc222209@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.35",
    "uvicorn>=0.30.6",
    "openpyxl (>=3.1.5,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "xlrd (>=2.0.2,<3.0.0)",
]

[tool.poetry]
packages = [{include = "asignacion_estudiantes_service", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
ruff = ">=0.6.9"

[tool.pytest.ini_options]
pythonpath = ["src"]
